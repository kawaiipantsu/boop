<?xml version="1.0" encoding="UTF-8"?>
<!-- Boop primary mark. A terminal prompt: chevron plus cursor.
     Pure geometry, no fonts, so it renders identically everywhere. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Boop">
  <title>Boop</title>
  <defs>
    <linearGradient id="boopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="55%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" ry="116" fill="url(#boopGrad)"/>
  <!-- chevron -->
  <path d="M 168 168 L 250 256 L 168 344" fill="none" stroke="#FFFFFF" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor: the accent is the "boop" -->
  <rect x="286" y="318" width="110" height="30" rx="15" fill="#FBBF24"/>
</svg>
